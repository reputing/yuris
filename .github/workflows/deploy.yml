# Deploys yuri.xxx to Cloudflare Workers on every push to main (and on demand).
# One-time setup: add two repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_ACCOUNT_ID   your Cloudflare account id
#   CLOUDFLARE_API_TOKEN    a token with: Workers Scripts: Edit, D1: Edit, and (for a custom domain) Workers Routes: Edit
# Optional:
#   ADMIN_TOKEN             the bearer token for /api/admin/* (set as a Worker secret on each deploy when present)
# Everything else is automatic: the D1 database is created on the first run, migrations are applied, then the site is built and published.
name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      # Without the two secrets this run does nothing (and says so) instead of failing every push.
      - name: Check the Cloudflare secrets are set
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Automatic deploy is off: add CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN as repository secrets (see the top of this workflow)."
          fi
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.CLOUDFLARE_API_TOKEN != ''
      # a type error or a failing test stops the deploy before anything is published
      - run: npx tsc --noEmit
        if: env.CLOUDFLARE_API_TOKEN != ''
      - run: npm test
        if: env.CLOUDFLARE_API_TOKEN != ''
      - name: Create the D1 database if needed and point wrangler at it
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: bash scripts/ci-d1.sh
      - name: Apply database migrations (idempotent)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler d1 migrations apply yuris --remote
      # `next build` can stop once on a package security advisory notice ("retry to continue"): try again once
      - name: Build and publish
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run deploy || npm run deploy
      - name: Set the admin token (only when the secret exists)
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          if [ -n "$ADMIN_TOKEN" ]; then printf '%s' "$ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN; else echo "no ADMIN_TOKEN secret: the admin routes stay closed"; fi
